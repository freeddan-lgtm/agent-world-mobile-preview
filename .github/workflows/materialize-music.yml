name: Materialize music MP3s
on:
  push:
    paths:
      - 'music/*.mp3.b64.*'
      - 'music/*.mp3.b64'
      - '.github/workflows/materialize-music.yml'
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Concat base64 chunks and decode to MP3
        run: |
          set -euo pipefail
          shopt -s nullglob
          for i in 1 2 3 4 5 6 7; do
            chunks=(music/tweezer-2001-p${i}.mp3.b64.*)
            if [ ${#chunks[@]} -eq 0 ] && [ -f music/tweezer-2001-p${i}.mp3.b64 ]; then
              base64 -d "music/tweezer-2001-p${i}.mp3.b64" > "music/tweezer-2001-p${i}.mp3"
            elif [ ${#chunks[@]} -gt 0 ]; then
              IFS=$'\n' sorted=($(printf '%s\n' "${chunks[@]}" | sort))
              cat "${sorted[@]}" | base64 -d > "music/tweezer-2001-p${i}.mp3"
            else
              echo "No b64 for part $i"; continue
            fi
            ls -lh "music/tweezer-2001-p${i}.mp3"
            file "music/tweezer-2001-p${i}.mp3"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/*.mp3 || true
          if git diff --cached --quiet; then
            echo "No MP3 changes"
            exit 0
          fi
          git commit -m "Materialize Phish 7/1/98 Tweezer>2001 MP3 parts from chunked b64"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebase onto origin/main and retry"
            git pull --rebase origin main
          done
          echo "Failed to push after retries"
          exit 1
